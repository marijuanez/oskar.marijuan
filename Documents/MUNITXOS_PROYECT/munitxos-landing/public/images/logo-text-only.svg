<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 60" width="360" height="60">
  <defs>
    <!-- Premium Metallic Gold Gradient -->
    <linearGradient id="goldGradientFooter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE8A6" />
      <stop offset="35%" stop-color="#FFD700" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997315" />
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Ranchers&amp;display=swap');
      .munchos-brand-text {
        font-family: 'Ranchers', 'Plus Jakarta Sans', sans-serif;
        font-size: 46px;
        font-weight: 400;
        fill: url(#goldGradientFooter);
        letter-spacing: 2px;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- MUNCHOS Ranchers Brand Text -->
  <text x="0" y="44" class="munchos-brand-text">MUNCHOS</text>
</svg>
